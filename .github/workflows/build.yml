name: Build EGrab

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  # ===== macOS aarch64 + x86_64 =====
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dependencies
        run: npm install

      - name: Build Tauri (aarch64)
        run: npm run tauri build -- --target aarch64-apple-darwin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect aarch64 DMG
        run: |
          mkdir -p dist-artifacts
          cp src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg dist-artifacts/

      - name: Build Tauri (x86_64)
        run: npm run tauri build -- --target x86_64-apple-darwin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect x86_64 DMG
        run: |
          mkdir -p dist-artifacts
          cp src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg dist-artifacts/

      - name: Upload DMGs
        uses: actions/upload-artifact@v4
        with:
          name: EGrab-macOS
          path: dist-artifacts/*.dmg

  # ===== Windows x86_64 =====
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install WebView2
        run: |
          # WebView2 is pre-installed on windows-latest runner
          echo "WebView2 is available"

      - name: Install dependencies
        run: npm install

      - name: Build Tauri
        run: npm run tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: EGrab-Windows-x64
          path: src-tauri/target/release/bundle/msi/*.msi

  # ===== Release: create GitHub Release for tag pushes =====
  release:
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: EGrab-macOS
          path: artifacts/macos

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: EGrab-Windows-x64
          path: artifacts/windows

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            artifacts/macos/*.dmg
            artifacts/windows/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
